<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>

    <nav>
      <button onclick="edit(event)">
      <i class="fa-solid fa-pencil"></i>
      </button>
      <button onclick="orignal(event)"><i class="fa-solid fa-rotate-left"></i></button>
      <select onclick="drop(event)" id="incre">
        <option>+1</option>
        <option>+2</option>
        <option>+3</option>
        <option>+4</option>
        <option>+5</option>
        <option>+6</option>
        <option>+7</option>
        <option>+8</option>
        <option>+9</option>
        <option>+10</option>
      </select>
      <button class="small">i</button>
    </nav>

    <div class="main">
      <section class="container1">
        <div id="num"></div>
      </section>

      <section class="container2">
        <div class="btn">
          <button onclick="counter(event)">+</button>
        </div>
      </section>
    </div>

    <div>
      <footer>
        <button onclick="one(event)">—</button>
        <button>
          <i class="fa-solid fa-eye"></i>
        </button>
      </footer>
    </div>

    <script src="ecmascript.js"></script>
  </body>
</html>
